name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
      confirmation:
        description: 'Type "destroy" to confirm you want to destroy the infrastructure'
        required: true
        type: string

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

jobs:
  validate-confirmation:
    name: Validate Confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation input
        run: |
          if [[ "${{ github.event.inputs.confirmation }}" != "destroy" ]]; then
            echo "::error::Confirmation does not match. You must type 'destroy' to proceed."
            exit 1
          fi
          echo "Confirmation validated. Proceeding with destroy for: ${{ github.event.inputs.environment }}"

  terraform-destroy:
    name: Terraform Destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || 'development' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set TF Directory
        id: env
        run: |
          echo "tf_dir=terraform/environments/${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: terraform init -input=false

      - name: Terraform Plan Destroy
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: |
          terraform plan \
            -destroy \
            -var-file=terraform.tfvars \
            -no-color \
            2>&1

      - name: Terraform Destroy
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: |
          terraform destroy \
            -var-file=terraform.tfvars \
            -auto-approve \
            2>&1

      - name: Summary
        run: |
          echo "## ⚠️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY

