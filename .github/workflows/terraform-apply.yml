name: Terraform Apply

on:
  push:
    branches: [main, develop]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "tf_dir=terraform/environments/prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "tf_dir=terraform/environments/dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform Plan
        id: plan
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -no-color \
            -out=tfplan \
            2>&1

      - name: Terraform Apply
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: terraform apply -auto-approve tfplan

      - name: Capture Outputs
        working-directory: ${{ steps.env.outputs.tf_dir }}
        run: |
          echo "## Terraform Outputs — ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color 2>&1 | grep -v "sensitive" >> $GITHUB_STEP_SUMMARY || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Terraform apply failed for environment: ${{ steps.env.outputs.environment }}"
          echo "::error::Check the logs above for details."

